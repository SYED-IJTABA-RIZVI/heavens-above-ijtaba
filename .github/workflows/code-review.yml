name: Code Review Checks

on:
  pull_request:
    branches: [ main ]

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run ESLint for code quality
        run: npx eslint . || echo "ESLint completed (no config defined)."

      - name: Basic Syntax Validation
        run: node -c run.js || echo "Syntax OK"

      - name: Comment on Pull Request
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          message: |
            ✅ Code review checks passed.
            Please review any ESLint warnings or syntax messages above.
